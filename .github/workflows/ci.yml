name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Lint (compileall)
        run: python -m compileall -q src tests

      - name: Install (no runtime deps)
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest

      - name: Run pytest
        run: pytest tests/ -q

      - name: CLI demo (basic.json must fail with exit 1)
        run: |
          python -m llm_eval run examples/basic.json --report report.md --json report.json; code=$?
          if [ "$code" -ne 1 ]; then echo "expected exit 1, got $code"; exit 1; fi
