name: Release to PyPI

# Publishes llm-eval-ci to public PyPI on every v* tag,
# using PyPI Trusted Publishing (OIDC) — no API token stored in CI.
#
# One-time setup (PyPI, ~2 min, by the package owner):
#   1. Open https://pypi.org/manage/project/llm-eval-ci/settings/publishing/
#      (or "Add a new pending publisher" on pypi.org if the project has no release yet)
#   2. Publisher: GitHub — Owner: shenn667
#      Repository: llm-eval-ci
#      Workflow name: release.yml
#      Environment name: (leave empty)
#   3. Push a tag (git tag v0.1.0 && git push origin v0.1.0) — this workflow
#      builds, checks TestPyPI optionally, and publishes to PyPI automatically.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build backend
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Run tests before release
        run: |
          pip install -e . pytest && pytest -q

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG package=$PKG"
          test "$TAG" = "$PKG" || { echo "::error::tag v$TAG != pyproject version $PKG"; exit 1; }

      - name: Build sdist + wheel
        run: python -m build

      - name: Check distributions
        run: twine check dist/*

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
